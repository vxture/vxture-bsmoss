name: env-update
on:
  workflow_dispatch:
    inputs:
      stage:
        type: choice
        required: true
        options:
          - beta
          - prod
      config_kind:
        description: Keep app credentials separate from database owner configuration
        type: choice
        required: true
        options:
          - app
          - stack
          - worker
          - aggregate-worker
          - report-worker
permissions:
  contents: read
concurrency:
  group: delivery-${{ inputs.stage }}
  cancel-in-progress: false
jobs:
  delivery:
    runs-on: ubuntu-latest
    environment: ${{ inputs.stage }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Validate configuration
        env:
          STACK_ROOT: ${{ vars.STACK_ROOT }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || secrets.DEPLOY_WORKER02_PORT || vars.DEPLOY_PORT || '22' }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || secrets.DEPLOY_WORKER02_HOST || vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || secrets.DEPLOY_WORKER02_USER || vars.DEPLOY_USER }}
          IMAGE_REF: ${{ inputs.image_ref }}
        run: |
          set -euo pipefail
          bash deploy/assert-stack-root.sh "$STACK_ROOT"
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]] && ((DEPLOY_PORT >= 1 && DEPLOY_PORT <= 65535))
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-zA-Z0-9_-]+$ ]]
      - name: Join tailnet and prepare SSH
        uses: ./.github/actions/tailnet-ssh-connect
        with:
          tailscale-oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          tailscale-oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tailscale-tag: ${{ vars.TAILSCALE_OAUTH_CLIENT_TAG }}
          deploy-host: ${{ secrets.DEPLOY_HOST || secrets.DEPLOY_WORKER02_HOST || vars.DEPLOY_HOST }}
          deploy-port: ${{ secrets.DEPLOY_PORT || secrets.DEPLOY_WORKER02_PORT || vars.DEPLOY_PORT || '22' }}
          deploy-ssh-key: ${{ secrets.DEPLOY_SSH_KEY || secrets.DEPLOY_WORKER02_SSH_KEY }}
          deploy-ssh-passphrase: ${{ secrets.DEPLOY_SSH_KEY_PASSPHRASE || secrets.DEPLOY_WORKER02_SSH_KEY_PASSPHRASE }}
          deploy-known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS || secrets.DEPLOY_WORKER02_KNOWN_HOSTS }}
      - name: Deliver reviewed bundle
        env:
          STACK_ROOT: ${{ vars.STACK_ROOT }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || secrets.DEPLOY_WORKER02_PORT || vars.DEPLOY_PORT || '22' }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || secrets.DEPLOY_WORKER02_HOST || vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || secrets.DEPLOY_WORKER02_USER || vars.DEPLOY_USER }}
        run: |-
          set -euo pipefail
          tar -czf /tmp/bsmoss-delivery.tgz deploy docker-compose.yml docker-compose.workers.yml
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$STACK_ROOT'"
          scp -i ~/.ssh/deploy_key -P "$DEPLOY_PORT" -o StrictHostKeyChecking=yes /tmp/bsmoss-delivery.tgz "$DEPLOY_USER@$DEPLOY_HOST:$STACK_ROOT/delivery.tgz"
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "tar -xzf '$STACK_ROOT/delivery.tgz' -C '$STACK_ROOT'"
      - name: Run env-update app
        env:
          STACK_ROOT: ${{ vars.STACK_ROOT }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || secrets.DEPLOY_WORKER02_PORT || vars.DEPLOY_PORT || '22' }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || secrets.DEPLOY_WORKER02_HOST || vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || secrets.DEPLOY_WORKER02_USER || vars.DEPLOY_USER }}
          RUNTIME_ENV_FILE: ${{ secrets.APP_ENV_FILE }}
          CONFIG_KIND: ${{ inputs.config_kind }}
        run: |-
          set -euo pipefail
          printf "%s\n" "$RUNTIME_ENV_FILE" | ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "CONFIG_KIND='$CONFIG_KIND' STACK_ROOT='$STACK_ROOT' bash '$STACK_ROOT/deploy/env-update.sh'"
        if: ${{ inputs.config_kind == 'app' }}
      - name: Run env-update stack
        env:
          STACK_ROOT: ${{ vars.STACK_ROOT }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || secrets.DEPLOY_WORKER02_PORT || vars.DEPLOY_PORT || '22' }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || secrets.DEPLOY_WORKER02_HOST || vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || secrets.DEPLOY_WORKER02_USER || vars.DEPLOY_USER }}
          RUNTIME_ENV_FILE: ${{ secrets.STACK_ENV_FILE }}
          CONFIG_KIND: ${{ inputs.config_kind }}
        run: |-
          set -euo pipefail
          printf "%s\n" "$RUNTIME_ENV_FILE" | ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "CONFIG_KIND='$CONFIG_KIND' STACK_ROOT='$STACK_ROOT' bash '$STACK_ROOT/deploy/env-update.sh'"
        if: ${{ inputs.config_kind == 'stack' }}
      - name: Run worker configuration update
        if: ${{ inputs.config_kind == 'worker' || inputs.config_kind == 'aggregate-worker' || inputs.config_kind == 'report-worker' }}
        env:
          STACK_ROOT: ${{ vars.STACK_ROOT }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || secrets.DEPLOY_WORKER02_PORT || vars.DEPLOY_PORT || '22' }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || secrets.DEPLOY_WORKER02_HOST || vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || secrets.DEPLOY_WORKER02_USER || vars.DEPLOY_USER }}
          CONFIG_KIND: ${{ inputs.config_kind }}
          WORKER_ENV_FILE: ${{ secrets.WORKER_ENV_FILE }}
          AGGREGATE_WORKER_CONFIG: ${{ secrets.AGGREGATE_WORKER_CONFIG }}
          REPORT_WORKER_CONFIG: ${{ secrets.REPORT_WORKER_CONFIG }}
        run: |-
          set -euo pipefail
          case "$CONFIG_KIND" in
            worker) content="$WORKER_ENV_FILE" ;;
            aggregate-worker) content="$AGGREGATE_WORKER_CONFIG" ;;
            report-worker) content="$REPORT_WORKER_CONFIG" ;;
            *) exit 1 ;;
          esac
          printf "%s\n" "$content" | ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "CONFIG_KIND='$CONFIG_KIND' STACK_ROOT='$STACK_ROOT' bash '$STACK_ROOT/deploy/env-update.sh'"
      - name: Remove runner SSH key
        if: ${{ always() }}
        run: rm -f ~/.ssh/deploy_key
