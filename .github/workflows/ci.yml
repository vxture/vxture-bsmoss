name: ci
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OSV_SCANNER_VERSION: "2.4.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Cache osv-scanner binary
        id: osv-cache
        uses: actions/cache@v4
        with:
          path: /tmp/osv-bin
          key: osv-scanner-${{ env.OSV_SCANNER_VERSION }}-linux-amd64
      - name: Download osv-scanner (cache miss only)
        if: ${{ steps.osv-cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          sha256=15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0
          url="https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          mkdir -p /tmp/osv-bin
          curl -fsSL --proto "=https" --proto-redir "=https" --tlsv1.2 "$url" -o /tmp/osv-bin/osv-scanner
          echo "${sha256}  /tmp/osv-bin/osv-scanner" | sha256sum -c -
      - name: OSV dependency scan
        shell: bash
        run: |
          set -euo pipefail
          chmod +x /tmp/osv-bin/osv-scanner
          /tmp/osv-bin/osv-scanner scan -L pnpm-lock.yaml --config .osv-scanner.toml --allow-no-lockfiles
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: pnpm
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
      - run: pnpm type-check:all
      - run: pnpm lint:docs-numbering && pnpm lint:schema-mirror && pnpm lint:sca && pnpm lint:delivery
      - run: pnpm prisma:validate
      - run: git diff --check
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: pnpm
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
      - run: pnpm build
      - run: pnpm test:portal
  test-coverage:
    name: test-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: pnpm
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
      - run: pnpm test:coverage
  db-contract:
    name: db-contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: pnpm
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
      - run: pnpm test:db
        env:
          TEST_DATABASE_ADMIN_URL: postgresql://postgres@127.0.0.1:5432/postgres
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
