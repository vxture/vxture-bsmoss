name: build-image
on:
  workflow_dispatch: {}
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    environment: build
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Validate image repository
        env:
          IMAGE_REPOSITORY: ${{ vars.IMAGE_REPOSITORY }}
        run: '[[ "$IMAGE_REPOSITORY" =~ ^ghcr.io/[a-z0-9_-]+/bsmoss-app$ ]] || exit 1'
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: image
        with:
          context: .
          file: portals/app/Dockerfile
          push: true
          tags: ${{ vars.IMAGE_REPOSITORY }}:${{ github.sha }}
          build-args: |-
            APP_VERSION=${{ github.sha }}
            GIT_SHA=${{ github.sha }}
          secrets: node_auth_token=${{ secrets.NODE_AUTH_TOKEN }}
      - name: Record digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: 'printf "Image digest: %s\n" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"'
      - name: Scan immutable image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ vars.IMAGE_REPOSITORY }}@${{ steps.image.outputs.digest }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
